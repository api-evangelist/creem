- aid: creem:discounts
  name: Creem Discounts API
  tags:
  - Discounts
  - Coupons
  - Promotions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.creem.io/api-reference/endpoint/create-discount
  baseURL: https://api.creem.io/v1
  properties:
  - url: https://docs.creem.io/api-reference/endpoint/create-discount
    type: Documentation
  - url: https://docs.creem.io/api-reference/endpoint/delete-discount
    type: APIReference
  - url: openapi/creem-openapi.yml
    type: OpenAPI
  description: Create, retrieve, search, and delete promotional discount codes (percentage
