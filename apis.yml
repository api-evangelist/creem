- aid: creem:licenses
  name: Creem Licenses API
  tags:
  - Licenses
  - License Keys
  - Activation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.creem.io/api-reference/endpoint/validate-license
  baseURL: https://api.creem.io/v1
  properties:
  - url: https://docs.creem.io/features/license-keys
    type: Documentation
  - url: https://docs.creem.io/api-reference/endpoint/validate-license
    type: APIReference
  - url: openapi/creem-openapi.yml
    type: OpenAPI
  description: Validate, activate, and deactivate software license keys and their
    per-device instances, with activation limits and expiry, for distributing and
    enforcing licensed software.
- aid: creem:webhooks
  name: Creem Webhooks API
  tags:
  - Webhooks
  - Events
  - HMAC
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.creem.io/learn/webhooks/introduction
  baseURL: https://api.creem.io/v1
  properties:
  - url: https://docs.creem.io/learn/webhooks/introduction
    type: Documentation
  - url: https://docs.creem.io/learn/webhooks/event-types
    type: APIReference
  - url: openapi/creem-openapi.yml
    type: OpenAPI
  description: HMAC-SHA256 signed event notifications for checkout, subscription,
    refund, and dispute events, delivered to seller-configured endpoints for keeping
    application state in sync with Creem.
