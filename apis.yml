aid: creem
url: https://raw.githubusercontent.com/api-evangelist/creem/refs/heads/main/apis.yml
name: Creem
kind: company
description: Creem is a merchant-of-record payments platform built for SaaS and AI
  startups. Its REST API handles products, hosted checkouts, customers, subscriptions,
  transactions, discounts, and software license keys, while Creem acts as the merchant
  of record to manage global sales tax, VAT, fraud, and compliance on the seller's
  behalf.
