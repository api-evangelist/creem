meters:
- name: transaction_percentage_fee
  description: Percentage component (3.9%) charged on the value of each successful transaction.
  unit: percent
  aggregation: sum
  dimensions:
  - account
  - product
  - currency
- name: transaction_fixed_fee
  description: Fixed per-transaction component ($0.40) charged on each successful transaction.
  unit: transactions
  aggregation: count
  dimensions:
  - account
  - product
- name: processed_volume
  description: Gross payment volume processed through Creem, the base for percentage fees.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - product
  - currency
- name: refunds_disputes
  description: Refunds, chargebacks, and disputes that reverse or adjust prior charges.
  unit: transactions
  aggregation: count
  dimensions:
  - account
  - product
principles:
- name: Visibility
  description: Pull Creem transaction history via the Transactions API; reconcile gross volume vs. fees and payouts.
- name: Allocation
  description: Tag transactions with product_id and metadata to map revenue and processing cost to teams and products.
- name: Optimization
  description: Reduce effective fee rate by increasing average order value, minimizing refunds/disputes via fraud protection, and consolidating low-value charges.
- name: Accountability
  description: Review the twice-monthly payout statements against expected net revenue and budget each billing cycle.
