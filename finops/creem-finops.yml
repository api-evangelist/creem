description: >-
  FinOps view of Creem spend. Creem is a merchant of record that charges a
  flat percentage plus a fixed fee on each successful transaction
  (3.9% + $0.40), with no setup or monthly fees. Cost scales directly with
  processed payment volume and the count of successful transactions, so the
  primary levers are average order value, transaction count, refund/dispute
  rate, and currency mix. Payouts are made twice monthly.
notes: >-
  Per-transaction percentage and fixed fee are subject to change; verify
  against the Creem pricing page and confirm any dispute, chargeback, or
  currency-conversion fees during reconciliation.
sources:
- https://www.creem.io/pricing
- https://docs.creem.io
